<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 880" width="1140" height="880">
    <defs>
        <marker id="depArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#000" />
        </marker>
    </defs>

    <text x="570" y="32" font-family="'Times New Roman', serif" font-size="16" font-weight="bold" text-anchor="middle">Deployment Diagram: Physical Hosting Topology &amp; Cloud Infrastructure</text>

    <!-- NODE 1: Client Device (3D Box) -->
    <g transform="translate(40, 70)">
        <!-- 3D top & side -->
        <polygon points="0,15 15,0 265,0 250,15" fill="#f0f0f0" stroke="#000" stroke-width="1.3"/>
        <polygon points="250,15 265,0 265,220 250,235" fill="#e4e4e4" stroke="#000" stroke-width="1.3"/>
        <rect x="0" y="15" width="250" height="220" fill="#fff" stroke="#000" stroke-width="1.3"/>
        <text x="125" y="38" font-family="'Times New Roman', serif" font-size="11" font-weight="bold" text-anchor="middle">&lt;&lt;device&gt;&gt;</text>
        <text x="125" y="55" font-family="'Times New Roman', serif" font-size="12" font-weight="bold" text-anchor="middle">Client Tier (Desktop / Mobile)</text>

        <!-- Inner execution environment -->
        <rect x="20" y="70" width="210" height="145" fill="#fcfcfc" stroke="#000" stroke-width="1"/>
        <text x="125" y="90" font-family="'Times New Roman', serif" font-size="10" text-anchor="middle">&lt;&lt;execution environment&gt;&gt;</text>
        <text x="125" y="105" font-family="'Times New Roman', serif" font-size="11" font-weight="bold" text-anchor="middle">Web Browser (Chrome / Safari)</text>

        <!-- Artifact -->
        <rect x="35" y="125" width="180" height="70" fill="#fff" stroke="#000" stroke-width="1"/>
        <text x="125" y="145" font-family="'Times New Roman', serif" font-size="9.5" text-anchor="middle">&lt;&lt;artifact&gt;&gt;</text>
        <text x="125" y="162" font-family="'Times New Roman', serif" font-size="11" font-weight="bold" text-anchor="middle">CardaLink Client App</text>
        <text x="125" y="178" font-family="'Times New Roman', serif" font-size="9.5" text-anchor="middle">(React.js SPA / HTML5 / JS)</text>
    </g>

    <!-- NODE 2: Vercel Cloud Platform (3D Box) -->
    <g transform="translate(40, 390)">
        <polygon points="0,15 15,0 265,0 250,15" fill="#f0f0f0" stroke="#000" stroke-width="1.3"/>
        <polygon points="250,15 265,0 265,220 250,235" fill="#e4e4e4" stroke="#000" stroke-width="1.3"/>
        <rect x="0" y="15" width="250" height="220" fill="#fff" stroke="#000" stroke-width="1.3"/>
        <text x="125" y="38" font-family="'Times New Roman', serif" font-size="11" font-weight="bold" text-anchor="middle">&lt;&lt;cloud platform&gt;&gt;</text>
        <text x="125" y="55" font-family="'Times New Roman', serif" font-size="12" font-weight="bold" text-anchor="middle">Vercel Edge Platform</text>
        <text x="125" y="70" font-family="'Times New Roman', serif" font-size="9.5" text-anchor="middle">(https://carda-link.vercel.app)</text>

        <!-- Inner execution environment -->
        <rect x="20" y="85" width="210" height="130" fill="#fcfcfc" stroke="#000" stroke-width="1"/>
        <text x="125" y="105" font-family="'Times New Roman', serif" font-size="10" text-anchor="middle">&lt;&lt;execution environment&gt;&gt;</text>
        <text x="125" y="120" font-family="'Times New Roman', serif" font-size="11" font-weight="bold" text-anchor="middle">Vercel Global CDN / Edge</text>

        <!-- Artifact -->
        <rect x="35" y="135" width="180" height="65" fill="#fff" stroke="#000" stroke-width="1"/>
        <text x="125" y="155" font-family="'Times New Roman', serif" font-size="9.5" text-anchor="middle">&lt;&lt;artifact&gt;&gt;</text>
        <text x="125" y="172" font-family="'Times New Roman', serif" font-size="11" font-weight="bold" text-anchor="middle">Vite Static Production Build</text>
        <text x="125" y="188" font-family="'Times New Roman', serif" font-size="9.5" text-anchor="middle">(dist/ &amp; vercel.json rewrite)</text>
    </g>

    <!-- Communication Client -> Vercel -->
    <line x1="165" y1="305" x2="165" y2="397" stroke="#000" stroke-width="1.5" marker-end="url(#depArrow)"/>
    <text x="175" y="355" font-family="'Times New Roman', serif" font-size="10" font-weight="bold">HTTPS / TLS 1.3 (Port 443)</text>

    <!-- NODE 3: Render Application Server (3D Box - Center) -->
    <g transform="translate(420, 70)">
        <polygon points="0,15 15,0 355,0 340,15" fill="#f0f0f0" stroke="#000" stroke-width="1.3"/>
        <polygon points="340,15 355,0 355,420 340,435" fill="#e4e4e4" stroke="#000" stroke-width="1.3"/>
        <rect x="0" y="15" width="340" height="420" fill="#fff" stroke="#000" stroke-width="1.3"/>
        <text x="170" y="38" font-family="'Times New Roman', serif" font-size="11" font-weight="bold" text-anchor="middle">&lt;&lt;cloud PaaS server&gt;&gt;</text>
        <text x="170" y="55" font-family="'Times New Roman', serif" font-size="12" font-weight="bold" text-anchor="middle">Render Linux Container (PaaS Web Service)</text>
        <text x="170" y="70" font-family="'Times New Roman', serif" font-size="9.5" text-anchor="middle">(cardalink-server.onrender.com)</text>

        <!-- Python Env -->
        <rect x="25" y="85" width="290" height="330" fill="#fcfcfc" stroke="#000" stroke-width="1"/>
        <text x="170" y="105" font-family="'Times New Roman', serif" font-size="10" text-anchor="middle">&lt;&lt;execution environment&gt;&gt;</text>
        <text x="170" y="120" font-family="'Times New Roman', serif" font-size="11" font-weight="bold" text-anchor="middle">Python 3.9+ / Gunicorn WSGI Runtime</text>

        <!-- Components inside -->
        <rect x="45" y="135" width="250" height="60" fill="#fff" stroke="#000" stroke-width="1"/>
        <text x="170" y="155" font-family="'Times New Roman', serif" font-size="9.5" text-anchor="middle">&lt;&lt;component&gt;&gt;</text>
        <text x="170" y="172" font-family="'Times New Roman', serif" font-size="11" font-weight="bold" text-anchor="middle">Django REST Framework API</text>
        <text x="170" y="187" font-family="'Times New Roman', serif" font-size="9" text-anchor="middle">(cardalink_server &amp; iam apps)</text>

        <rect x="45" y="210" width="250" height="55" fill="#fff" stroke="#000" stroke-width="1"/>
        <text x="170" y="230" font-family="'Times New Roman', serif" font-size="9.5" text-anchor="middle">&lt;&lt;component&gt;&gt;</text>
        <text x="170" y="247" font-family="'Times New Roman', serif" font-size="11" font-weight="bold" text-anchor="middle">Delivery Token &amp; Email Engine</text>

        <rect x="45" y="280" width="250" height="55" fill="#fff" stroke="#000" stroke-width="1"/>
        <text x="170" y="300" font-family="'Times New Roman', serif" font-size="9.5" text-anchor="middle">&lt;&lt;component&gt;&gt;</text>
        <text x="170" y="317" font-family="'Times New Roman', serif" font-size="11" font-weight="bold" text-anchor="middle">Django ORM / psycopg2 Driver</text>

        <rect x="45" y="350" width="250" height="50" fill="#fff" stroke="#000" stroke-width="1"/>
        <text x="170" y="370" font-family="'Times New Roman', serif" font-size="9.5" text-anchor="middle">&lt;&lt;artifact&gt;&gt;</text>
        <text x="170" y="388" font-family="'Times New Roman', serif" font-size="10.5" font-weight="bold" text-anchor="middle">Environment Secrets (.env)</text>
    </g>

    <!-- Communication Client -> Backend -->
    <path d="M 290 145 L 412 145" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#depArrow)"/>
    <text x="355" y="135" font-family="'Times New Roman', serif" font-size="9.5" font-weight="bold" text-anchor="middle">REST API / HTTPS</text>
    <text x="355" y="160" font-family="'Times New Roman', serif" font-size="9" text-anchor="middle">(Port 443 / CORS)</text>

    <!-- NODE 4: Database Server (3D Box - Right) -->
    <g transform="translate(860, 70)">
        <polygon points="0,15 15,0 245,0 230,15" fill="#f0f0f0" stroke="#000" stroke-width="1.3"/>
        <polygon points="230,15 245,0 245,350 230,365" fill="#e4e4e4" stroke="#000" stroke-width="1.3"/>
        <rect x="0" y="15" width="230" height="350" fill="#fff" stroke="#000" stroke-width="1.3"/>
        <text x="115" y="38" font-family="'Times New Roman', serif" font-size="11" font-weight="bold" text-anchor="middle">&lt;&lt;cloud database server&gt;&gt;</text>
        <text x="115" y="55" font-family="'Times New Roman', serif" font-size="12" font-weight="bold" text-anchor="middle">Render Managed PostgreSQL</text>

        <!-- PG Engine -->
        <rect x="20" y="75" width="190" height="270" fill="#fcfcfc" stroke="#000" stroke-width="1"/>
        <text x="115" y="95" font-family="'Times New Roman', serif" font-size="10" text-anchor="middle">&lt;&lt;execution environment&gt;&gt;</text>
        <text x="115" y="110" font-family="'Times New Roman', serif" font-size="11" font-weight="bold" text-anchor="middle">PostgreSQL 15+ Engine</text>

        <!-- DB Artifact -->
        <rect x="35" y="130" width="160" height="195" fill="#fff" stroke="#000" stroke-width="1"/>
        <text x="115" y="150" font-family="'Times New Roman', serif" font-size="9.5" text-anchor="middle">&lt;&lt;database artifact&gt;&gt;</text>
        <text x="115" y="168" font-family="'Times New Roman', serif" font-size="11" font-weight="bold" text-anchor="middle">cardalink_db</text>
        <line x1="45" y1="178" x2="185" y2="178" stroke="#999" stroke-width="1"/>
        <text x="45" y="196" font-family="'Times New Roman', serif" font-size="9.5">• 25 Relational Tables</text>
        <text x="45" y="214" font-family="'Times New Roman', serif" font-size="9.5">• Primary &amp; Foreign Keys</text>
        <text x="45" y="232" font-family="'Times New Roman', serif" font-size="9.5">• B-Tree Indexes</text>
        <text x="45" y="250" font-family="'Times New Roman', serif" font-size="9.5">• Connection Pooling</text>
        <text x="45" y="268" font-family="'Times New Roman', serif" font-size="9.5">• SSL Encrypted Transit</text>
    </g>

    <!-- Communication Backend -> Database -->
    <path d="M 760 350 L 852 350" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#depArrow)"/>
    <text x="806" y="340" font-family="'Times New Roman', serif" font-size="9.5" font-weight="bold" text-anchor="middle">PostgreSQL Wire</text>
    <text x="806" y="365" font-family="'Times New Roman', serif" font-size="9" text-anchor="middle">SSL TCP:5432</text>

    <!-- NODE 5, 6, 7: External Cloud APIs (Bottom Row) -->
    <!-- Google Identity -->
    <g transform="translate(340, 560)">
        <polygon points="0,10 10,0 210,0 200,10" fill="#f0f0f0" stroke="#000" stroke-width="1.2"/>
        <polygon points="200,10 210,0 210,120 200,130" fill="#e4e4e4" stroke="#000" stroke-width="1.2"/>
        <rect x="0" y="10" width="200" height="120" fill="#fff" stroke="#000" stroke-width="1.2"/>
        <text x="100" y="28" font-family="'Times New Roman', serif" font-size="10" text-anchor="middle">&lt;&lt;cloud identity&gt;&gt;</text>
        <text x="100" y="44" font-family="'Times New Roman', serif" font-size="11" font-weight="bold" text-anchor="middle">Google Identity Services</text>
        <text x="100" y="60" font-family="'Times New Roman', serif" font-size="9.5" text-anchor="middle">OAuth 2.0 Auth Server</text>
        <text x="100" y="80" font-family="'Times New Roman', serif" font-size="9" text-anchor="middle">Token Verification</text>
        <text x="100" y="95" font-family="'Times New Roman', serif" font-size="9" text-anchor="middle">HTTPS Port 443</text>
    </g>

    <!-- Razorpay -->
    <g transform="translate(590, 560)">
        <polygon points="0,10 10,0 210,0 200,10" fill="#f0f0f0" stroke="#000" stroke-width="1.2"/>
        <polygon points="200,10 210,0 210,120 200,130" fill="#e4e4e4" stroke="#000" stroke-width="1.2"/>
        <rect x="0" y="10" width="200" height="120" fill="#fff" stroke="#000" stroke-width="1.2"/>
        <text x="100" y="28" font-family="'Times New Roman', serif" font-size="10" text-anchor="middle">&lt;&lt;cloud gateway&gt;&gt;</text>
        <text x="100" y="44" font-family="'Times New Roman', serif" font-size="11" font-weight="bold" text-anchor="middle">Razorpay Infrastructure</text>
        <text x="100" y="60" font-family="'Times New Roman', serif" font-size="9.5" text-anchor="middle">Payment Gateway API</text>
        <text x="100" y="80" font-family="'Times New Roman', serif" font-size="9" text-anchor="middle">Webhooks &amp; Settlement</text>
        <text x="100" y="95" font-family="'Times New Roman', serif" font-size="9" text-anchor="middle">HTTPS Port 443</text>
    </g>

    <!-- SMTP -->
    <g transform="translate(840, 560)">
        <polygon points="0,10 10,0 210,0 200,10" fill="#f0f0f0" stroke="#000" stroke-width="1.2"/>
        <polygon points="200,10 210,0 210,120 200,130" fill="#e4e4e4" stroke="#000" stroke-width="1.2"/>
        <rect x="0" y="10" width="200" height="120" fill="#fff" stroke="#000" stroke-width="1.2"/>
        <text x="100" y="28" font-family="'Times New Roman', serif" font-size="10" text-anchor="middle">&lt;&lt;cloud service&gt;&gt;</text>
        <text x="100" y="44" font-family="'Times New Roman', serif" font-size="11" font-weight="bold" text-anchor="middle">SMTP Mail Gateway</text>
        <text x="100" y="60" font-family="'Times New Roman', serif" font-size="9.5" text-anchor="middle">Gmail / SMTP Relay</text>
        <text x="100" y="80" font-family="'Times New Roman', serif" font-size="9" text-anchor="middle">Token Email Delivery</text>
        <text x="100" y="95" font-family="'Times New Roman', serif" font-size="9" text-anchor="middle">TLS Port 587</text>
    </g>

    <!-- Connecting Backend to Cloud Services -->
    <path d="M 500 505 L 440 562" fill="none" stroke="#000" stroke-width="1.3" stroke-dasharray="3,3" marker-end="url(#depArrow)"/>
    <path d="M 590 505 L 690 562" fill="none" stroke="#000" stroke-width="1.3" stroke-dasharray="3,3" marker-end="url(#depArrow)"/>
    <path d="M 680 505 L 870 562" fill="none" stroke="#000" stroke-width="1.3" stroke-dasharray="3,3" marker-end="url(#depArrow)"/>
</svg>