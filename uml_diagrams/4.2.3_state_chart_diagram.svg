<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 860" width="1100" height="860">
    <defs>
        <marker id="stateArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#000" />
        </marker>
    </defs>

    <text x="550" y="32" font-family="'Times New Roman', serif" font-size="16" font-weight="bold" text-anchor="middle">State Chart Diagram: Export Order Lifecycle Management</text>

    <!-- Initial state -->
    <circle cx="90" cy="90" r="12" fill="#000"/>
    <line x1="102" y1="90" x2="148" y2="90" stroke="#000" stroke-width="1.5" marker-end="url(#stateArrow)"/>
    <text x="125" y="80" font-family="'Times New Roman', serif" font-size="10" text-anchor="middle">Create</text>

    <!-- State 1: DRAFT -->
    <g transform="translate(150, 65)">
        <rect x="0" y="0" width="160" height="50" rx="8" fill="#fff" stroke="#000" stroke-width="1.5"/>
        <line x1="0" y1="22" x2="160" y2="22" stroke="#000" stroke-width="1"/>
        <text x="80" y="16" font-family="'Times New Roman', serif" font-size="11" font-weight="bold" text-anchor="middle">DRAFT</text>
        <text x="80" y="38" font-family="'Times New Roman', serif" font-size="9.5" text-anchor="middle">entry / Init export order</text>
    </g>

    <!-- Transition to CONFIRMED -->
    <line x1="310" y1="90" x2="388" y2="90" stroke="#000" stroke-width="1.5" marker-end="url(#stateArrow)"/>
    <text x="350" y="80" font-family="'Times New Roman', serif" font-size="10" text-anchor="middle">[Verify contract]</text>

    <!-- State 2: CONFIRMED -->
    <g transform="translate(390, 65)">
        <rect x="0" y="0" width="170" height="50" rx="8" fill="#fff" stroke="#000" stroke-width="1.5"/>
        <line x1="0" y1="22" x2="170" y2="22" stroke="#000" stroke-width="1"/>
        <text x="85" y="16" font-family="'Times New Roman', serif" font-size="11" font-weight="bold" text-anchor="middle">CONFIRMED</text>
        <text x="85" y="38" font-family="'Times New Roman', serif" font-size="9.5" text-anchor="middle">entry / Allocate inventory lot</text>
    </g>

    <!-- Transition to QUALITY_CHECK -->
    <line x1="560" y1="90" x2="638" y2="90" stroke="#000" stroke-width="1.5" marker-end="url(#stateArrow)"/>
    <text x="600" y="80" font-family="'Times New Roman', serif" font-size="10" text-anchor="middle">[Submit samples]</text>

    <!-- State 3: QUALITY_CHECK -->
    <g transform="translate(640, 65)">
        <rect x="0" y="0" width="180" height="50" rx="8" fill="#fff" stroke="#000" stroke-width="1.5"/>
        <line x1="0" y1="22" x2="180" y2="22" stroke="#000" stroke-width="1"/>
        <text x="90" y="16" font-family="'Times New Roman', serif" font-size="11" font-weight="bold" text-anchor="middle">QUALITY_CHECK</text>
        <text x="90" y="38" font-family="'Times New Roman', serif" font-size="9.5" text-anchor="middle">do / Lab moisture &amp; size test</text>
    </g>

    <!-- Transition to QUALITY_REJECTED (branch right) -->
    <line x1="820" y1="90" x2="898" y2="90" stroke="#000" stroke-width="1.5" marker-end="url(#stateArrow)"/>
    <text x="860" y="80" font-family="'Times New Roman', serif" font-size="10" text-anchor="middle">[Fail: &gt;11%]</text>

    <g transform="translate(900, 65)">
        <rect x="0" y="0" width="160" height="50" rx="8" fill="#fff" stroke="#000" stroke-width="1.5"/>
        <line x1="0" y1="22" x2="160" y2="22" stroke="#000" stroke-width="1"/>
        <text x="80" y="16" font-family="'Times New Roman', serif" font-size="11" font-weight="bold" text-anchor="middle">QUALITY_REJECTED</text>
        <text x="80" y="38" font-family="'Times New Roman', serif" font-size="9.5" text-anchor="middle">exit / Re-cure or downgrade</text>
    </g>

    <!-- Cancelled from rejected -->
    <line x1="980" y1="115" x2="980" y2="188" stroke="#000" stroke-width="1.5" marker-end="url(#stateArrow)"/>
    <text x="1025" y="150" font-family="'Times New Roman', serif" font-size="10" text-anchor="middle">[Discard lot]</text>

    <g transform="translate(900, 190)">
        <rect x="0" y="0" width="160" height="50" rx="8" fill="#fff" stroke="#000" stroke-width="1.5"/>
        <line x1="0" y1="22" x2="160" y2="22" stroke="#000" stroke-width="1"/>
        <text x="80" y="16" font-family="'Times New Roman', serif" font-size="11" font-weight="bold" text-anchor="middle">CANCELLED</text>
        <text x="80" y="38" font-family="'Times New Roman', serif" font-size="9.5" text-anchor="middle">entry / Terminate order</text>
    </g>
    <circle cx="980" cy="275" r="14" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <circle cx="980" cy="275" r="9" fill="#000"/>
    <line x1="980" y1="240" x2="980" y2="259" stroke="#000" stroke-width="1.5" marker-end="url(#stateArrow)"/>

    <!-- QUALITY_CHECK -> QUALITY_APPROVED (downward) -->
    <line x1="730" y1="115" x2="730" y2="188" stroke="#000" stroke-width="1.5" marker-end="url(#stateArrow)"/>
    <text x="790" y="150" font-family="'Times New Roman', serif" font-size="10" text-anchor="middle">[Pass: &lt;=11% &amp; 8mm]</text>

    <!-- State 4: QUALITY_APPROVED -->
    <g transform="translate(640, 190)">
        <rect x="0" y="0" width="180" height="50" rx="8" fill="#fff" stroke="#000" stroke-width="1.5"/>
        <line x1="0" y1="22" x2="180" y2="22" stroke="#000" stroke-width="1"/>
        <text x="90" y="16" font-family="'Times New Roman', serif" font-size="11" font-weight="bold" text-anchor="middle">QUALITY_APPROVED</text>
        <text x="90" y="38" font-family="'Times New Roman', serif" font-size="9.5" text-anchor="middle">entry / Issue lab certificate</text>
    </g>

    <!-- Transition to PACKAGING (leftward) -->
    <line x1="640" y1="215" x2="562" y2="215" stroke="#000" stroke-width="1.5" marker-end="url(#stateArrow)"/>
    <text x="600" y="205" font-family="'Times New Roman', serif" font-size="10" text-anchor="middle">[Stage packing]</text>

    <!-- State 5: PACKAGING -->
    <g transform="translate(390, 190)">
        <rect x="0" y="0" width="170" height="50" rx="8" fill="#fff" stroke="#000" stroke-width="1.5"/>
        <line x1="0" y1="22" x2="170" y2="22" stroke="#000" stroke-width="1"/>
        <text x="85" y="16" font-family="'Times New Roman', serif" font-size="11" font-weight="bold" text-anchor="middle">PACKAGING</text>
        <text x="85" y="38" font-family="'Times New Roman', serif" font-size="9.5" text-anchor="middle">do / Vacuum pack &amp; label</text>
    </g>

    <!-- Transition to DOCUMENTS_PENDING (leftward) -->
    <line x1="390" y1="215" x2="322" y2="215" stroke="#000" stroke-width="1.5" marker-end="url(#stateArrow)"/>
    <text x="355" y="205" font-family="'Times New Roman', serif" font-size="10" text-anchor="middle">[Pack complete]</text>

    <!-- State 6: DOCUMENTS_PENDING -->
    <g transform="translate(140, 190)">
        <rect x="0" y="0" width="180" height="50" rx="8" fill="#fff" stroke="#000" stroke-width="1.5"/>
        <line x1="0" y1="22" x2="180" y2="22" stroke="#000" stroke-width="1"/>
        <text x="90" y="16" font-family="'Times New Roman', serif" font-size="11" font-weight="bold" text-anchor="middle">DOCUMENTS_PENDING</text>
        <text x="90" y="38" font-family="'Times New Roman', serif" font-size="9.5" text-anchor="middle">do / Phytosanitary, Origin, BL</text>
    </g>

    <!-- Transition down to READY_FOR_SHIPMENT -->
    <line x1="230" y1="240" x2="230" y2="328" stroke="#000" stroke-width="1.5" marker-end="url(#stateArrow)"/>
    <text x="310" y="285" font-family="'Times New Roman', serif" font-size="10" text-anchor="middle">[All statutory clearances verified]</text>

    <!-- State 7: READY_FOR_SHIPMENT -->
    <g transform="translate(140, 330)">
        <rect x="0" y="0" width="180" height="50" rx="8" fill="#fff" stroke="#000" stroke-width="1.5"/>
        <line x1="0" y1="22" x2="180" y2="22" stroke="#000" stroke-width="1"/>
        <text x="90" y="16" font-family="'Times New Roman', serif" font-size="11" font-weight="bold" text-anchor="middle">READY_FOR_SHIPMENT</text>
        <text x="90" y="38" font-family="'Times New Roman', serif" font-size="9.5" text-anchor="middle">entry / Port staging</text>
    </g>

    <!-- Transition to SHIPPED (rightward) -->
    <line x1="320" y1="355" x2="398" y2="355" stroke="#000" stroke-width="1.5" marker-end="url(#stateArrow)"/>
    <text x="360" y="345" font-family="'Times New Roman', serif" font-size="10" text-anchor="middle">[Vessel departs]</text>

    <!-- State 8: SHIPPED -->
    <g transform="translate(400, 330)">
        <rect x="0" y="0" width="160" height="50" rx="8" fill="#fff" stroke="#000" stroke-width="1.5"/>
        <line x1="0" y1="22" x2="160" y2="22" stroke="#000" stroke-width="1"/>
        <text x="80" y="16" font-family="'Times New Roman', serif" font-size="11" font-weight="bold" text-anchor="middle">SHIPPED</text>
        <text x="80" y="38" font-family="'Times New Roman', serif" font-size="9.5" text-anchor="middle">entry / Issue tracking #</text>
    </g>

    <!-- Transition to IN_TRANSIT (rightward) -->
    <line x1="560" y1="355" x2="638" y2="355" stroke="#000" stroke-width="1.5" marker-end="url(#stateArrow)"/>
    <text x="600" y="345" font-family="'Times New Roman', serif" font-size="10" text-anchor="middle">[Freight carrier en route]</text>

    <!-- State 9: IN_TRANSIT -->
    <g transform="translate(640, 330)">
        <rect x="0" y="0" width="170" height="50" rx="8" fill="#fff" stroke="#000" stroke-width="1.5"/>
        <line x1="0" y1="22" x2="170" y2="22" stroke="#000" stroke-width="1"/>
        <text x="85" y="16" font-family="'Times New Roman', serif" font-size="11" font-weight="bold" text-anchor="middle">IN_TRANSIT</text>
        <text x="85" y="38" font-family="'Times New Roman', serif" font-size="9.5" text-anchor="middle">do / Real-time tracking</text>
    </g>

    <!-- Transition down to ARRIVED -->
    <line x1="725" y1="380" x2="725" y2="468" stroke="#000" stroke-width="1.5" marker-end="url(#stateArrow)"/>
    <text x="805" y="425" font-family="'Times New Roman', serif" font-size="10" text-anchor="middle">[Dock at destination port]</text>

    <!-- State 10: ARRIVED -->
    <g transform="translate(640, 470)">
        <rect x="0" y="0" width="170" height="50" rx="8" fill="#fff" stroke="#000" stroke-width="1.5"/>
        <line x1="0" y1="22" x2="170" y2="22" stroke="#000" stroke-width="1"/>
        <text x="85" y="16" font-family="'Times New Roman', serif" font-size="11" font-weight="bold" text-anchor="middle">ARRIVED</text>
        <text x="85" y="38" font-family="'Times New Roman', serif" font-size="9.5" text-anchor="middle">entry / Customs clearance</text>
    </g>

    <!-- Transition to AWAITING_BUYER_CONFIRMATION (leftward) -->
    <line x1="640" y1="495" x2="562" y2="495" stroke="#000" stroke-width="1.5" marker-end="url(#stateArrow)"/>
    <text x="600" y="485" font-family="'Times New Roman', serif" font-size="10" text-anchor="middle">[Email token link]</text>

    <!-- State 11: AWAITING_BUYER_CONFIRMATION -->
    <g transform="translate(320, 470)">
        <rect x="0" y="0" width="240" height="50" rx="8" fill="#fff" stroke="#000" stroke-width="1.5"/>
        <line x1="0" y1="22" x2="240" y2="22" stroke="#000" stroke-width="1"/>
        <text x="120" y="16" font-family="'Times New Roman', serif" font-size="11" font-weight="bold" text-anchor="middle">AWAITING_BUYER_CONFIRMATION</text>
        <text x="120" y="38" font-family="'Times New Roman', serif" font-size="9.5" text-anchor="middle">do / Buyer inspecting cargo consignment</text>
    </g>

    <!-- Branch: DELIVERY_DISPUTE -->
    <line x1="440" y1="520" x2="440" y2="608" stroke="#000" stroke-width="1.5" marker-end="url(#stateArrow)"/>
    <text x="495" y="565" font-family="'Times New Roman', serif" font-size="10" text-anchor="middle">[Damaged / Shortage]</text>

    <g transform="translate(340, 610)">
        <rect x="0" y="0" width="200" height="50" rx="8" fill="#fff" stroke="#000" stroke-width="1.5"/>
        <line x1="0" y1="22" x2="200" y2="22" stroke="#000" stroke-width="1"/>
        <text x="100" y="16" font-family="'Times New Roman', serif" font-size="11" font-weight="bold" text-anchor="middle">DELIVERY_DISPUTE</text>
        <text x="100" y="38" font-family="'Times New Roman', serif" font-size="9.5" text-anchor="middle">do / Joint insurance &amp; cargo survey</text>
    </g>

    <!-- Resolve dispute to DELIVERED -->
    <line x1="540" y1="635" x2="638" y2="635" stroke="#000" stroke-width="1.5" marker-end="url(#stateArrow)"/>
    <text x="590" y="625" font-family="'Times New Roman', serif" font-size="10" text-anchor="middle">[Claim settled]</text>

    <!-- Normal: AWAITING -> DELIVERED -->
    <path d="M 560 505 L 725 505 L 725 608" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#stateArrow)"/>
    <text x="790" y="555" font-family="'Times New Roman', serif" font-size="10" text-anchor="middle">[Condition: GOOD]</text>

    <!-- State 12: DELIVERED -->
    <g transform="translate(640, 610)">
        <rect x="0" y="0" width="170" height="50" rx="8" fill="#fff" stroke="#000" stroke-width="1.5"/>
        <line x1="0" y1="22" x2="170" y2="22" stroke="#000" stroke-width="1"/>
        <text x="85" y="16" font-family="'Times New Roman', serif" font-size="11" font-weight="bold" text-anchor="middle">DELIVERED</text>
        <text x="85" y="38" font-family="'Times New Roman', serif" font-size="9.5" text-anchor="middle">entry / Delivery receipt logged</text>
    </g>

    <!-- Transition down to COMPLETED -->
    <line x1="725" y1="660" x2="725" y2="738" stroke="#000" stroke-width="1.5" marker-end="url(#stateArrow)"/>
    <text x="795" y="700" font-family="'Times New Roman', serif" font-size="10" text-anchor="middle">[Payment &amp; Ledger Settled]</text>

    <!-- State 13: COMPLETED -->
    <g transform="translate(640, 740)">
        <rect x="0" y="0" width="170" height="50" rx="8" fill="#fff" stroke="#000" stroke-width="1.5"/>
        <line x1="0" y1="22" x2="170" y2="22" stroke="#000" stroke-width="1"/>
        <text x="85" y="16" font-family="'Times New Roman', serif" font-size="11" font-weight="bold" text-anchor="middle">COMPLETED</text>
        <text x="85" y="38" font-family="'Times New Roman', serif" font-size="9.5" text-anchor="middle">entry / Close export contract</text>
    </g>

    <!-- Final State -->
    <line x1="810" y1="765" x2="888" y2="765" stroke="#000" stroke-width="1.5" marker-end="url(#stateArrow)"/>
    <circle cx="910" cy="765" r="14" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <circle cx="910" cy="765" r="9" fill="#000"/>
</svg>