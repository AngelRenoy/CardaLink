    <text x="260" y="103" font-family="'Times New Roman', serif" font-size="11" font-weight="bold" fill="#333333">User &amp; Authentication Subsystem</text>

    <rect x="250" y="205" width="610" height="115" fill="#fafafa" stroke="#888888" stroke-width="1" stroke-dasharray="4,4" rx="4"/>
