    <line x1="980" y1="360" x2="505" y2="505" stroke="#000" stroke-width="1.3"/>
    <line x1="980" y1="360" x2="510" y2="580" stroke="#000" stroke-width="1.3"/>
    <line x1="980" y1="360" x2="805" y2="580" stroke="#000" stroke-width="1.3"/>
    <line x1="980" y1="360" x2="505" y2="690" stroke="#000" stroke-width="1.3"/>
