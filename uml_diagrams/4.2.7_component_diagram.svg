    <rect x="880" y="60" width="230" height="360" fill="#ffffff" stroke="#000" stroke-width="1.5" rx="4"/>
    <rect x="880" y="60" width="160" height="24" fill="#f0f0f0" stroke="#000" stroke-width="1.5"/>
