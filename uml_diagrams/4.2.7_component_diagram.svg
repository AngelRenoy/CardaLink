<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 880" width="1140" height="880">
    <defs>
        <marker id="compArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
