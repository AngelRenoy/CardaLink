        <rect x="-6" y="24" width="12" height="8" fill="#fff" stroke="#000" stroke-width="1"/>
        <text x="135" y="22" font-family="'Times New Roman', serif" font-size="10" text-anchor="middle">&lt;&lt;component&gt;&gt;</text>
        <text x="135" y="38" font-family="'Times New Roman', serif" font-size="11" font-weight="bold" text-anchor="middle">Trader Dashboard (TraderDashboard.jsx)</text>
