        <text x="165" y="35" font-family="'Times New Roman', serif" font-size="11" font-weight="bold" text-anchor="middle">Delivery Token Engine (delivery_service.py)</text>
    </g>

    <g transform="translate(450, 560)">
        <rect x="0" y="0" width="330" height="45" fill="#f8f8f8" stroke="#000" stroke-width="1.3"/>
        <rect x="-6" y="8" width="12" height="8" fill="#fff" stroke="#000" stroke-width="1"/>
        <rect x="-6" y="24" width="12" height="8" fill="#fff" stroke="#000" stroke-width="1"/>
        <text x="165" y="20" font-family="'Times New Roman', serif" font-size="9.5" text-anchor="middle">&lt;&lt;component&gt;&gt;</text>
        <text x="165" y="35" font-family="'Times New Roman', serif" font-size="11" font-weight="bold" text-anchor="middle">Serializers &amp; Validators (serializers.py)</text>
