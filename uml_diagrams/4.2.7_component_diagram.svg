        <text x="15" y="55" font-family="'Times New Roman', serif" font-size="9.5">• tbl_users &amp; identities</text>
        <text x="15" y="75" font-family="'Times New Roman', serif" font-size="9.5">• tbl_plantations</text>
        <text x="15" y="95" font-family="'Times New Roman', serif" font-size="9.5">• tbl_harvest_records</text>
        <text x="15" y="115" font-family="'Times New Roman', serif" font-size="9.5">• tbl_agrochemical_usages</text>
        <text x="15" y="135" font-family="'Times New Roman', serif" font-size="9.5">• tbl_inventory_items</text>
        <text x="15" y="155" font-family="'Times New Roman', serif" font-size="9.5">• tbl_marketplace_listings</text>
        <text x="15" y="175" font-family="'Times New Roman', serif" font-size="9.5">• tbl_purchase_requests</text>
        <text x="15" y="195" font-family="'Times New Roman', serif" font-size="9.5">• tbl_international_buyers</text>
        <text x="15" y="215" font-family="'Times New Roman', serif" font-size="9.5">• tbl_export_orders</text>
        <text x="15" y="235" font-family="'Times New Roman', serif" font-size="9.5">• tbl_quality_records</text>
        <text x="15" y="255" font-family="'Times New Roman', serif" font-size="9.5">• tbl_shipment_records</text>
        <text x="15" y="275" font-family="'Times New Roman', serif" font-size="9.5">• tbl_delivery_confirmations</text>
    </g>

    <!-- ORM to Database connection -->
    <path d="M 780 665 L 995 665 L 995 410" fill="none" stroke="#000" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#compArrow)"/>
    <text x="890" y="655" font-family="'Times New Roman', serif" font-size="10" font-style="italic" text-anchor="middle">&lt;&lt;SQL Connection TCP 5432&gt;&gt;</text>

