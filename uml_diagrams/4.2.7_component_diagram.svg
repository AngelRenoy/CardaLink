    <text x="40" y="76" font-family="'Times New Roman', serif" font-size="11" font-weight="bold">Client Presentation Tier (React.js)</text>

    <!-- Frontend Components -->
    <g transform="translate(50, 100)">
        <rect x="0" y="0" width="270" height="48" fill="#fff" stroke="#000" stroke-width="1.2"/>
        <rect x="-6" y="8" width="12" height="8" fill="#fff" stroke="#000" stroke-width="1"/>
        <rect x="-6" y="24" width="12" height="8" fill="#fff" stroke="#000" stroke-width="1"/>
        <text x="135" y="22" font-family="'Times New Roman', serif" font-size="10" text-anchor="middle">&lt;&lt;component&gt;&gt;</text>
        <text x="135" y="38" font-family="'Times New Roman', serif" font-size="11" font-weight="bold" text-anchor="middle">Auth &amp; Role Guard (AppRoutes.jsx)</text>
    </g>

    <g transform="translate(50, 165)">
