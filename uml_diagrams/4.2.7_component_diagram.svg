    <!-- Communication: Frontend to Backend API -->
    <path d="M 320 545 L 385 545 L 385 125 L 442 125" fill="none" stroke="#000" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#compArrow)"/>
    <text x="385" y="330" font-family="'Times New Roman', serif" font-size="10" font-style="italic" text-anchor="middle" transform="rotate(-90 385 330)">&lt;&lt;HTTPS / JSON REST API&gt;&gt;</text>

