        <rect x="-6" y="24" width="12" height="8" fill="#fff" stroke="#000" stroke-width="1"/>
        <text x="165" y="20" font-family="'Times New Roman', serif" font-size="9.5" text-anchor="middle">&lt;&lt;component&gt;&gt;</text>
        <text x="165" y="35" font-family="'Times New Roman', serif" font-size="11" font-weight="bold" text-anchor="middle">Export Order &amp; Logistics Controller</text>
